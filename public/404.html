<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pagina non trovata · Duetrack</title>
    <!-- 404 servita da GitHub Pages per ogni indirizzo che non esiste. Pagina statica a sé:
         percorsi assoluti, perché può comparire a qualunque profondità. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f9fc;
        --text: #1b2236;
        --muted: #5b6480;
        --line: #dfe3ec;
        --accent: #1d2b4f;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a2b;
          --text: #eef0f6;
          --muted: #a7aec2;
          --line: #2b3450;
          --accent: #fbbf24;
          --on-accent: #1d2b4f;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 30rem;
      }
      img {
        width: 5rem;
        height: 5rem;
      }
      .code {
        margin: 1rem 0 0;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        font-size: 1.9rem;
        line-height: 1.2;
        margin: 0.25rem 0 1rem;
        text-wrap: balance;
      }
      p {
        margin: 0 0 1rem;
        color: var(--muted);
        text-wrap: pretty;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }
      a.button {
        display: inline-block;
        padding: 0.7rem 1.2rem;
        border-radius: 0.75rem;
        font-weight: 600;
        text-decoration: none;
        border: 1px solid var(--line);
        color: var(--text);
      }
      a.button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <p class="code">Errore 404</p>
      <h1>Questa pagina non risulta in calendario</h1>
      <p>Abbiamo sfogliato tutti gli eventi, anche quelli da classificare: a questo indirizzo non c'è niente.</p>
      <p>La buona notizia è che per questa pagina nessuno ti deve niente.</p>
      <div class="actions">
        <a class="button primary" href="/">Torna a Duetrack</a>
        <a class="button" href="https://federicodiluca.com/progetti/">Altri progetti</a>
      </div>
    </main>
  </body>
</html>
